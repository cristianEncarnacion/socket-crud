<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocketsCrud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
    <link rel="stylesheet" href="main.css">
</head>
<body>
<div class="container h-100">
    <div class="row h-100 p-4">
        <div class="col-md-4 my-auto">
                <form id="noteForm" class="card card-body  rounded-0">
        <input type="text" id="title" class="form-control rounded-0 mb-3" placeholder="Write a title" required autofocus>
        <textarea class="form-control rounded-0 mb-3" placeholder="Write a description"  id="description" rows="3" required></textarea>

        <button class="btn btn-dark rounded-0">Send</button>

    </form>

    </div>
    <div class="col-md-8" id="note">
    </div>

</div>
</div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
